<div class="news-list">
  @for (item of news; track $index) {
  <div class="card">
    <h3>{{ item.title }}</h3>
    <img [src]="item.image" [alt]="item.title" class="card-image" />
    <div class="card-body">
      <p>{{ item.content }}</p>
      <div class=" btn-group" role="group" aria-label="Redes Sociales">
        <a href="https://facebook.com" target="_blank" class="btn btn-primary">
          <i class="bi bi-facebook"></i>
        </a>
        <a
          href="https://twitter.com"
          target="_blank"
          class="btn btn-info text-white"
        >
          <i class="bi bi-twitter"></i>
        </a>
        <a href="https://instagram.com" target="_blank" class="btn btn-danger">
          <i class="bi bi-instagram"></i>
        </a>
        <a href="https://linkedin.com" target="_blank" class="btn btn-primary">
          <i class="bi bi-linkedin"></i>
        </a>
      </div>
    </div>
  </div>
  }
</div>
