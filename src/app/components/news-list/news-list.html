<div class="news-list">
  @for (item of news; track $index) {
  <div class="card">
    <h3 class="card-title">{{ item.title }}</h3>
    <img 
      [src]="item.image" 
      [alt]="item.title" 
      class="card-img-top" 
    />
    <div class="card-body">
      <p class="card-text">{{ item.content }}</p>
      <div class="btn-group" role="group">
        <a class="btn btn-primary"><i class="bi bi-facebook"></i></a>
        <a class="btn btn-info text-white"><i class="bi bi-twitter"></i></a>
        <a class="btn btn-danger"><i class="bi bi-instagram"></i></a>
        <a class="btn btn-primary"><i class="bi bi-linkedin"></i></a>
       
        <!-- Aqui estoy agregando el botoncito con corazoncito -->
        <button class="btn btn-danger" (click)="marcarFavorito(item)">
          <i class="bi-heart-fill"></i>
        </button>

      </div>
    </div>
  </div>
  }
</div>
